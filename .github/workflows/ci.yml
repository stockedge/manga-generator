name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:md
      - run: node tests/verify-skills.mjs

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
      - name: Wrap Chrome with CI sandbox flags
        run: |
          printf '#!/bin/sh\nexec chrome --no-sandbox --disable-dev-shm-usage "$@"\n' > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
      - run: npm ci
      - run: npm run check:code
      - run: npm run check
        env:
          MANGA_PROJECT: works/sample/workflow.json
          MANGA_BROWSER: ${{ runner.temp }}/chrome-ci

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.3'
      - run: ruff check .
      - run: ruff format --check .
      - run: python3 tests/verify-comfyui-setup.py
