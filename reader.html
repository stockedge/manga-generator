<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>body{margin:0;background:#e7e5e0;color:#222;font-family:Meiryo,sans-serif}header,nav{max-width:920px;margin:10px auto;padding:8px;text-align:center}h1{font-size:18px;margin:8px}img{display:block;width:min(100%,840px);margin:auto}button{font:inherit;padding:8px 24px;margin:0 10px;cursor:pointer}button:disabled{cursor:default}a{color:#234b71}footer{text-align:center;padding:20px}</style>
<header><h1>{{TITLE}}</h1><p>原作：{{AUTHOR}} ／ コマは右から左へ</p></header>
<nav aria-label="ページ移動"><button id="next">次のページ ←</button><span id="position" aria-live="polite"></span><button id="prev">→ 前のページ</button></nav>
<main><img id="page" alt=""></main><footer><a href="index.html">全ページを続けて読む・印刷</a></footer>
<script>
const pages={{PAGES}};
let current=0;
const image=document.getElementById('page'),next=document.getElementById('next'),prev=document.getElementById('prev'),position=document.getElementById('position');
function show(){image.src='page-'+pages[current].id+'.svg';image.alt=pages[current].alt;position.textContent=(current+1)+' / '+pages.length;prev.disabled=current===0;next.disabled=current===pages.length-1;}
function move(delta){current=Math.max(0,Math.min(pages.length-1,current+delta));show();window.scrollTo(0,0);}
next.addEventListener('click',()=>move(1));prev.addEventListener('click',()=>move(-1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(1)}if(e.key==='ArrowRight'){e.preventDefault();move(-1)}});
show();
</script></html>
